<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kannans Cash"><title>Kannans Cash</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><style>
:root{color-scheme:dark;--bg:#101820;--card:#1c2934;--soft:#263642;--line:#35434c;--mint:#9aebc5;--text:#f5f8fa;--muted:#a7b6c0;--red:#ffaaa8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:580px;margin:auto;padding:22px 16px 110px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:25px;margin:0}h2{font-size:19px;margin:24px 0 12px}h3{font-size:15px;margin:0 0 10px}.muted,small{color:var(--muted)}.card{background:var(--card);border-radius:18px;padding:17px;margin:10px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:24px;font-weight:750;margin-top:8px;overflow-wrap:anywhere}.mint{color:var(--mint)}.red{color:var(--red)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;background:var(--soft);color:var(--text)}button.primary{background:#80e5b2;color:#09271c;font-weight:750}button.outline{border:1px solid var(--line);background:transparent}button.danger{background:#663238;color:#fff}button:disabled{opacity:.4}input,select,textarea{width:100%;background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 12px;outline:none}label{display:block;font-size:13px;color:var(--muted);margin-top:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row>div{min-width:0}.transaction{padding:13px 0;border-bottom:1px solid var(--line)}.transaction:last-child{border:0}.pillrow{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:10px 12px;border:1px solid var(--line);background:var(--soft);border-radius:12px;font-size:13px}.pill.active{border-color:var(--mint);background:#23493c;color:var(--mint)}nav{position:fixed;bottom:0;left:0;right:0;background:#17232d;border-top:1px solid var(--line);display:flex;justify-content:center;padding:9px 4px max(12px,env(safe-area-inset-bottom));z-index:10}nav>div{display:flex;max-width:580px;width:100%;justify-content:space-around}nav button{background:transparent;padding:8px 4px;font-size:11px;color:var(--muted);min-width:56px}nav button.active{color:var(--mint)}nav button span{display:block;font-size:21px;margin-bottom:4px}.hidden{display:none!important}.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keypad button{font-size:23px;min-height:57px;background:#293a46}.keypad .primary{background:#80e5b2;color:#09271c}.amount{font-size:32px;font-weight:750;overflow-wrap:anywhere}.expression{font-size:15px;color:var(--muted);min-height:20px;overflow-wrap:anywhere}.categorygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.categorygrid button{min-height:65px;font-size:12px;padding:8px}.categorygrid button.active{outline:2px solid var(--mint);color:var(--mint)}.full{width:100%}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1}.tabs .active{background:#295342;color:var(--mint)}.notice{background:#233a40;border-left:3px solid var(--mint);padding:12px;border-radius:8px;color:#d5e9e5;font-size:13px}.section{margin-top:20px}.right{text-align:right}.smallbtn{font-size:12px;padding:8px}.bar{height:8px;background:#31414b;border-radius:9px;overflow:hidden;margin:8px 0}.bar>div{height:100%;background:#8de2b3}#toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#38644e;padding:11px 18px;border-radius:12px;z-index:30;display:none;white-space:nowrap}.empty{color:var(--muted);padding:16px;text-align:center}details{margin:8px 0}summary{cursor:pointer;color:var(--mint)}
</style></head><body><main><header><div><h1>Kannans Cash</h1><small>Personal finance tracker</small></div><button onclick="show('settings')" aria-label="Settings">⚙️</button></header><div id="view"></div></main><nav><div id="nav"></div></nav><div id="toast"></div><script>
'use strict';const KEY='kannans-cash-v1';const defaults={accounts:{sib:0,hdfc:0,cash:0},transactions:[],recurring:[],categories:['Food & Drinks','Car Stuff','Fuel','Aradhana','Mummy','Groceries','Shopping','Health','Other'],sources:['Salary','Dance Programs','Teaching','Business','Gifts','Refunds','Other']};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{db=structuredClone(defaults)};db={...structuredClone(defaults),...db};db.accounts={...defaults.accounts,...db.accounts};let page='home',kind='expense',expr='',category='Food & Drinks',source='Salary',payment='UPI',bank='sib',editing=null,filter={q:'',category:'All',payment:'All',start:'',end:''};const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('en-CA'),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),month=()=>today().slice(0,7),monthLabel=m=>new Date(m+'-01T12:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});let selectedMonth=month();function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function totals(txs){return {income:txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),expense:txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0)}}function accountName(a){return a==='sib'?'South Indian Bank':a==='hdfc'?'HDFC Bank':a==='cash'?'Cash in Hand':'No bank'}function delta(t){if(!t||!t.bank)return 0;return t.type==='income'?t.amount:t.type==='expense'?-t.amount:0}function apply(t,sign=1){if(t.bank&&db.accounts[t.bank]!==undefined)db.accounts[t.bank]+=sign*delta(t)}function record(t){if(editing){let old=db.transactions.find(x=>x.id===editing);apply(old,-1);db.transactions=db.transactions.filter(x=>x.id!==editing)}db.transactions.push(t);apply(t);editing=null;save();show('home');toast('Transaction saved')}function show(p){page=p;render()}function render(){const navs=[['home','⌂','Home'],['history','☷','History'],['expense','＋','Add'],['income','↙','Income'],['accounts','▣','Balances'],['reports','◉','Reports']];$('nav').innerHTML='<div>'+navs.map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="show('${p}')"><span>${i}</span>${n}</button>`).join('')+'</div>';let content={home:home,expense:()=>form('expense'),income:()=>form('income'),history:history,accounts:accounts,reports:reports,recurring:recurring,settings:settings}[page];$('view').innerHTML=content?content():'';if(page==='expense'||page==='income')updateAmount()}
function txrow(t,actions=false){return `<div class="transaction row"><div><strong>${esc(t.label||t.category||t.source)}</strong><div class="muted" style="font-size:12px;margin-top:4px">${esc(t.date)} · ${esc(t.type==='income'?t.source:t.category)} · ${esc(t.payment||'—')}${t.bank?' · '+esc(accountName(t.bank)):''}</div>${t.note?`<small>${esc(t.note)}</small>`:''}</div><div class="right"><strong class="${t.type==='income'?'mint':''}">${t.type==='income'?'+':'−'}${money(t.amount)}</strong>${actions?`<div style="margin-top:6px"><button class="smallbtn" onclick="editTx('${t.id}')">Edit</button> <button class="smallbtn" onclick="deleteTx('${t.id}')">Delete</button></div>`:''}</div></div>`}
function home(){const tx=db.transactions.filter(t=>t.date.startsWith(selectedMonth)),sum=totals(tx),upcoming=db.recurring.filter(r=>r.active!==false).sort((a,b)=>a.next.localeCompare(b.next)).slice(0,5);return `<div class="row"><h2>${monthLabel(selectedMonth)}</h2><div><button class="smallbtn" onclick="shiftMonth(-1)">‹</button> <button class="smallbtn" onclick="shiftMonth(1)">›</button></div></div><div class="grid2"><div class="card"><small>Total expenses</small><div class="metric red">${money(sum.expense)}</div></div><div class="card"><small>Total income</small><div class="metric mint">${money(sum.income)}</div></div></div><div class="card"><div class="row"><strong>Cash in Hand</strong><strong class="mint">${money(db.accounts.cash)}</strong></div><div class="row"><small>South Indian Bank: ${money(db.accounts.sib)}</small><small>HDFC: ${money(db.accounts.hdfc)}</small></div><div class="row"><strong>Total available</strong><strong>${money(db.accounts.cash+db.accounts.sib+db.accounts.hdfc)}</strong></div></div><button class="primary full" onclick="newTx('expense')">＋ Add Expense</button><h2>Recent transactions</h2><div class="card">${[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(t=>txrow(t)).join('')||'<div class="empty">No transactions yet</div>'}<button class="full outline" onclick="show('history')">See all</button></div><div class="row"><h2>Upcoming recurring payments</h2><button class="smallbtn" onclick="show('recurring')">Manage</button></div><div class="card">${upcoming.map(r=>`<div class="transaction"><div class="row"><div><strong>${esc(r.name)}</strong><br><small>Due ${esc(r.next)} · ${esc(r.frequency)}</small></div><strong>${money(r.amount)}</strong></div><button class="primary full" style="margin-top:10px" onclick="markPaid('${r.id}')">Mark as Paid</button></div>`).join('')||'<div class="empty">No recurring payments set up</div>'}</div>`}
function shiftMonth(n){let [y,m]=selectedMonth.split('-').map(Number);selectedMonth=new Date(y,m-1+n,1).toISOString().slice(0,7);render()}
function newTx(type){editing=null;expr='';category=db.categories[0];source=db.sources[0];payment='UPI';bank='sib';kind=type;show(type)}
function compute(s){if(!/^\d*\.?\d+(?:[+\-×÷]\d*\.?\d+)*$/.test(s))return null;let parts=s.split(/([+\-×÷])/),numbers=[Number(parts[0])],ops=[];for(let i=1;i<parts.length;i+=2){let op=parts[i],v=Number(parts[i+1]);if(op==='×')numbers[numbers.length-1]*=v;else if(op==='÷'){if(v===0)return null;numbers[numbers.length-1]/=v}else{ops.push(op);numbers.push(v)}}let result=numbers[0];ops.forEach((o,i)=>result=o==='+'?result+numbers[i+1]:result-numbers[i+1]);return Number.isFinite(result)?Math.round(result*100)/100:null}
function key(k){if(k==='C')expr='';else if(k==='⌫')expr=expr.slice(0,-1);else if(k==='='){let n=compute(expr);if(n!==null)expr=String(n)}else if('+-×÷'.includes(k)){if(!expr)return;if(/[+\-×÷]$/.test(expr))expr=expr.slice(0,-1);expr+=k}else if(k==='.'){if(!expr.split(/[+\-×÷]/).pop().includes('.'))expr+=k}else expr+=k;updateAmount()}
function updateAmount(){if(!$('amount'))return;let n=compute(expr);$('amount').textContent=n===null?'—':money(n);$('expression').textContent=expr||'0';$('saveTx').disabled=n===null||n<=0}
function form(type){kind=type;let income=type==='income';let arr=income?db.sources:db.categories,chosen=income?source:category;return `<div class="row"><h2>${editing?'Edit':'Add'} ${income?'Income':'Expense'}</h2><button class="smallbtn" onclick="newTx('${income?'income':'expense'}')">Clear</button></div><div class="card right"><div class="expression" id="expression"></div><div class="amount ${income?'mint':''}" id="amount">₹0</div></div><div class="keypad">${['7','8','9','÷','4','5','6','×','1','2','3','−','C','0','.','+','⌫','='].map(k=>`<button class="${k==='='?'primary':''}" style="${k==='='?'grid-column:span 3':''}" onclick="key('${k==='−'?'-':k}')">${k}</button>`).join('')}</div><h2>${income?'Income source':'Category'}</h2><div class="categorygrid">${arr.map(c=>`<button class="${chosen===c?'active':''}" onclick="chooseCategory('${encodeURIComponent(c)}','${type}')">${esc(c)}</button>`).join('')}</div><div class="section"><label>${income?'Received from (optional)':'Description / title (optional)'}</label><input id="label" placeholder="${income?'Person, client, or organisation':'e.g. Lunch, petrol'}" value="${esc(editing?db.transactions.find(t=>t.id===editing)?.label:'')}"><label>${income?'Received through':'Payment method'}</label><select id="payment" onchange="paymentChanged()">${(income?['Cash','UPI','Bank Transfer','Other']:['Cash','UPI','Debit Card','Credit Card']).map(p=>`<option ${payment===p?'selected':''}>${p}</option>`).join('')}</select><div id="bankWrap"><label>${income?'Deposit into':'Paid from bank'}</label><select id="bank"><option value="sib" ${bank==='sib'?'selected':''}>South Indian Bank</option><option value="hdfc" ${bank==='hdfc'?'selected':''}>HDFC Bank</option><option value="none" ${bank==='none'?'selected':''}>No tracked bank</option></select></div><label>Date</label><input id="date" type="date" value="${esc(editing?db.transactions.find(t=>t.id===editing)?.date:today())}"><label>Notes (optional)</label><textarea id="note" rows="2">${esc(editing?db.transactions.find(t=>t.id===editing)?.note:'')}</textarea><button id="saveTx" class="primary full" onclick="submitTx()">Save ${income?'Income':'Expense'}</button></div>`}
function chooseCategory(v,type){if(type==='income')source=decodeURIComponent(v);else category=decodeURIComponent(v);const vals={label:$('label').value,note:$('note').value,date:$('date').value,payment:$('payment').value,bank:$('bank')?.value};render();$('label').value=vals.label;$('note').value=vals.note;$('date').value=vals.date;$('payment').value=vals.payment;paymentChanged();if($('bank'))$('bank').value=vals.bank}
function paymentChanged(){let p=$('payment').value;let showBank=p!=='Cash'&&p!=='Other';$('bankWrap').classList.toggle('hidden',!showBank)}
function submitTx(){const amount=compute(expr);if(amount===null||amount<=0)return toast('Enter a valid amount');const p=$('payment').value,bankChoice=p==='Cash'?'cash':p==='Other'?null:($('bank').value==='none'?null:$('bank').value);if(!$('date').value)return toast('Select a date');const t={id:editing||id(),type:kind,amount,category:kind==='expense'?category:null,source:kind==='income'?source:null,label:$('label').value.trim()||(kind==='expense'?category:source),payment:p,bank:bankChoice,date:$('date').value,note:$('note').value.trim()};record(t)}
function editTx(i){let t=db.transactions.find(x=>x.id===i);if(!t)return;editing=i;kind=t.type;expr=String(t.amount);category=t.category||db.categories[0];source=t.source||db.sources[0];payment=t.payment||'UPI';bank=t.bank||'none';show(t.type);$('payment').value=payment;paymentChanged();if($('bank'))$('bank').value=bank}
function deleteTx(i){if(!confirm('Delete this transaction? Its bank balance effect will be reversed.'))return;let t=db.transactions.find(x=>x.id===i);apply(t,-1);db.transactions=db.transactions.filter(x=>x.id!==i);save();render();toast('Deleted')}
function history(){let tx=[...db.transactions].filter(t=>(t.label+' '+(t.note||'')+' '+(t.category||'')+' '+(t.source||'')).toLowerCase().includes(filter.q.toLowerCase())&&(filter.category==='All'||t.category===filter.category||t.source===filter.category)&&(filter.payment==='All'||t.payment===filter.payment)&&(!filter.start||t.date>=filter.start)&&(!filter.end||t.date<=filter.end)).sort((a,b)=>b.date.localeCompare(a.date));let days=[...new Set(tx.map(t=>t.date))];return `<h2>Transaction History</h2><input placeholder="Search name or notes" value="${esc(filter.q)}" oninput="filter.q=this.value;refreshHistory()"><div class="grid2"><div><label>Category / source</label><select onchange="filter.category=this.value;refreshHistory()"><option>All</option>${[...new Set([...db.categories,...db.sources])].map(c=>`<option ${filter.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div><label>Payment</label><select onchange="filter.payment=this.value;refreshHistory()">${['All','Cash','UPI','Debit Card','Credit Card','Bank Transfer','Other'].map(c=>`<option ${filter.payment===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label>From</label><input type="date" value="${filter.start}" onchange="filter.start=this.value;refreshHistory()"></div><div><label>To</label><input type="date" value="${filter.end}" onchange="filter.end=this.value;refreshHistory()"></div></div><div id="historyRows">${historyRows(tx,days)}</div>`}
function historyRows(tx,days){return days.map(d=>`<h3 class="section">${new Date(d+'T12:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</h3><div class="card">${tx.filter(t=>t.date===d).map(t=>txrow(t,true)).join('')}</div>`).join('')||'<div class="empty">No matching transactions</div>'}
function refreshHistory(){let q=$('view').querySelector('input[placeholder="Search name or notes"]');if(q)filter.q=q.value;let active=document.activeElement,sel=active===q?q.selectionStart:null;let tx=[...db.transactions].filter(t=>(t.label+' '+(t.note||'')+' '+(t.category||'')+' '+(t.source||'')).toLowerCase().includes(filter.q.toLowerCase())&&(filter.category==='All'||t.category===filter.category||t.source===filter.category)&&(filter.payment==='All'||t.payment===filter.payment)&&(!filter.start||t.date>=filter.start)&&(!filter.end||t.date<=filter.end)).sort((a,b)=>b.date.localeCompare(a.date));$('historyRows').innerHTML=historyRows(tx,[...new Set(tx.map(t=>t.date))])}
function accounts(){return `<h2>Balances</h2><div class="card"><small>Total available money</small><div class="metric mint">${money(db.accounts.sib+db.accounts.hdfc+db.accounts.cash)}</div></div>${[['cash','Cash in Hand'],['sib','South Indian Bank'],['hdfc','HDFC Bank']].map(([k,n])=>`<div class="card"><div class="row"><div><strong>${n}</strong><div class="metric">${money(db.accounts[k])}</div></div><button onclick="correct('${k}')">Adjust</button></div></div>`).join('')}<div class="notice">Cash expenses reduce Cash in Hand; cash income increases it. Adjustments set the actual balance without creating income or expenses.</div><h2>Move money</h2><div class="card"><label>From</label><select id="transferFrom">${accountOptions()}</select><label>To</label><select id="transferTo">${accountOptions('cash')}</select><label>Amount (₹)</label><input type="number" min="0.01" step="0.01" id="transferAmount" placeholder="0.00"><button class="primary full" onclick="transfer()">Move money</button></div>`}
function accountOptions(selected='sib'){return [['sib','South Indian Bank'],['hdfc','HDFC Bank'],['cash','Cash in Hand']].map(([k,n])=>`<option value="${k}" ${selected===k?'selected':''}>${n}</option>`).join('')}
function correct(k){let s=prompt('Enter current actual balance for '+accountName(k),String(db.accounts[k]));if(s===null)return;let n=Number(s);if(!Number.isFinite(n)||n<0)return toast('Invalid balance');db.accounts[k]=Math.round(n*100)/100;save();render();toast('Balance updated')}
function transfer(){let n=Number($('transferAmount').value),from=$('transferFrom').value,to=$('transferTo').value;if(!Number.isFinite(n)||n<=0)return toast('Enter a valid amount');if(from===to)return toast('Choose different accounts');if(n>db.accounts[from]&&!confirm('This transfer will make the source balance negative. Continue?'))return;db.accounts[from]=Math.round((db.accounts[from]-n)*100)/100;db.accounts[to]=Math.round((db.accounts[to]+n)*100)/100;save();render();toast('Money moved (not counted as income or expense)')}
function reports(){let tx=db.transactions.filter(t=>t.date.startsWith(selectedMonth)),sum=totals(tx),groups={},methods={};tx.filter(t=>t.type==='expense').forEach(t=>{groups[t.category]=(groups[t.category]||0)+t.amount;methods[t.payment]=(methods[t.payment]||0)+t.amount});const breakdown=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([name,n])=>`<div class="row"><span>${esc(name)}</span><strong>${money(n)}</strong></div><div class="bar"><div style="width:${sum.expense?100*n/sum.expense:0}%"></div></div>`).join('')||'<div class="empty">No expenses for this month</div>';return `<h2>Reports · ${monthLabel(selectedMonth)}</h2><div class="grid2"><div class="card"><small>Expenses</small><div class="metric red">${money(sum.expense)}</div></div><div class="card"><small>Income</small><div class="metric mint">${money(sum.income)}</div></div></div><div class="card"><small>Income less expenses</small><div class="metric">${money(sum.income-sum.expense)}</div></div><h2>By category</h2><div class="card">${breakdown(groups)}</div><h2>By payment method</h2><div class="card">${breakdown(methods)}</div><button class="outline full" onclick="exportCsv()">Export transactions CSV</button>`}
function recurring(){return `<h2>Recurring payments</h2><div class="card"><h3>Add recurring payment</h3><label>Name</label><input id="rName" placeholder="e.g. Internet bill"><label>Amount (₹)</label><input id="rAmount" type="number" min="0.01" step="0.01"><label>Category</label><select id="rCategory">${db.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select><label>Payment method</label><select id="rPayment" onchange="$('rBankWrap').classList.toggle('hidden',this.value==='Cash'||this.value==='Credit Card')"><option>UPI</option><option>Cash</option><option>Debit Card</option><option>Credit Card</option></select><div id="rBankWrap"><label>Bank account</label><select id="rBank"><option value="sib">South Indian Bank</option><option value="hdfc">HDFC Bank</option></select></div><label>Next due date</label><input id="rDate" type="date" value="${today()}"><label>Repeat</label><select id="rFreq"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="yearly">Yearly</option></select><button class="primary full" onclick="addRecurring()">Add recurring payment</button></div><h2>Scheduled</h2>${db.recurring.map(r=>`<div class="card"><div class="row"><div><strong>${esc(r.name)}</strong><br><small>${esc(r.next)} · ${esc(r.frequency)} · ${esc(r.category)}</small></div><strong>${money(r.amount)}</strong></div><div class="row" style="margin-top:12px"><button class="primary" onclick="markPaid('${r.id}')">Mark as Paid</button><button class="danger" onclick="removeRecurring('${r.id}')">Remove</button></div></div>`).join('')||'<div class="empty">No recurring payments</div>'}<div class="notice">Recurring items never deduct money automatically. They are recorded only when you tap Mark as Paid.</div>`}
function addRecurring(){let n=Number($('rAmount').value),name=$('rName').value.trim(),p=$('rPayment').value;if(!name||!Number.isFinite(n)||n<=0||!$('rDate').value)return toast('Complete name, amount and date');db.recurring.push({id:id(),name,amount:n,category:$('rCategory').value,payment:p,bank:p==='Cash'?'cash':p==='Credit Card'?null:$('rBank').value,next:$('rDate').value,frequency:$('rFreq').value});save();render();toast('Recurring payment added')}
function nextDate(d,f){let [y,m,day]=d.split('-').map(Number);let date=new Date(y,m-1,day,12);if(f==='weekly')date.setDate(date.getDate()+7);if(f==='monthly'){let target=new Date(y,m,1,12),last=new Date(y,m+1,0).getDate();target.setDate(Math.min(day,last));date=target}if(f==='yearly'){let target=new Date(y+1,m-1,1,12),last=new Date(y+1,m,0).getDate();target.setDate(Math.min(day,last));date=target}return date.toLocaleDateString('en-CA')}
function markPaid(i){let r=db.recurring.find(x=>x.id===i);if(!r)return;let date=prompt('Payment date (YYYY-MM-DD)',today());if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00').getTime()))return toast('Invalid date');let t={id:id(),type:'expense',amount:r.amount,category:r.category,label:r.name,payment:r.payment,bank:r.bank,date,note:'Recurring payment'};db.transactions.push(t);apply(t);r.next=nextDate(r.next,r.frequency);save();render();toast('Payment recorded')}
function removeRecurring(i){if(!confirm('Remove this recurring schedule? Past transactions remain.'))return;db.recurring=db.recurring.filter(r=>r.id!==i);save();render()}
function settings(){return `<h2>Settings</h2><div class="card"><h3>Categories</h3><div class="pillrow">${db.categories.map(c=>`<button class="pill" onclick="removeItem('categories','${encodeURIComponent(c)}')">${esc(c)} ×</button>`).join('')}</div><label>Add expense category</label><div class="row"><input id="newCat" placeholder="Category name"><button onclick="addItem('categories','newCat')">Add</button></div></div><div class="card"><h3>Income sources</h3><div class="pillrow">${db.sources.map(c=>`<button class="pill" onclick="removeItem('sources','${encodeURIComponent(c)}')">${esc(c)} ×</button>`).join('')}</div><label>Add income source</label><div class="row"><input id="newSource" placeholder="Source name"><button onclick="addItem('sources','newSource')">Add</button></div></div><div class="card"><h3>Back up your data</h3><p class="muted">Export a complete JSON backup, including cash and bank balances, categories, transactions and recurring payments. Keep this file somewhere safe.</p><button class="primary full" onclick="exportBackup()">Download complete backup</button><label>Restore a JSON backup</label><input type="file" accept="application/json,.json" onchange="importBackup(this)"><button class="outline full" onclick="exportCsv()">Export transactions CSV</button></div><div class="notice">Your records stay in this browser on this device. Clearing Safari website data or using another device can remove access to them. Back up regularly. No bank connection or cloud sync is included.</div>`}
function addItem(key,input){let v=$(input).value.trim();if(!v)return;if(db[key].some(x=>x.toLowerCase()===v.toLowerCase()))return toast('Already exists');db[key].push(v);save();render()}
function removeItem(key,v){let value=decodeURIComponent(v);if(db[key].length<=1)return toast('Keep at least one');if(!confirm('Remove '+value+' from quick options? Past records will keep it.'))return;db[key]=db[key].filter(x=>x!==value);save();render()}
function download(name,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(){download('kannans-cash-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
function exportCsv(){let rows=[['Date','Type','Title','Category','Income Source','Amount','Payment','Bank','Note'],...db.transactions.map(t=>[t.date,t.type,t.label,t.category||'',t.source||'',t.amount,t.payment||'',t.bank?accountName(t.bank):'',t.note||''])];download('kannans-cash-transactions-'+today()+'.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv')}
function importBackup(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d.accounts||!Array.isArray(d.transactions)||!Array.isArray(d.recurring)||!Array.isArray(d.categories)||!Array.isArray(d.sources))throw Error('Invalid format');if(!confirm('Replace ALL current app data with this backup?'))return;db={...structuredClone(defaults),...d,accounts:{...defaults.accounts,...d.accounts}};save();show('home');toast('Backup restored')}catch(e){alert('Could not restore: '+e.message)}};reader.readAsText(file)}
render();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
